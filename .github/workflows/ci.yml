name: CI

on:
  # No push trigger, deliberately. This job does not re-test a merge on dev or main. A merge
  # onto a base that moved after the PR ran is caught later: nightly.yml tests dev, and on a
  # release the dev-to-main PR runs this job and release.yml tests again before publishing.
  #
  # No paths-ignore here, deliberately. A required status check has to REPORT on every
  # PR, and a workflow skipped by a path filter reports nothing at all -- GitHub then
  # shows the check as forever pending and the PR can never merge. A docs-only PR would
  # deadlock. The filtering moved into the job below, where the steps are skipped but the
  # job still finishes and reports success. Same shape PerformanceMonitor's build.yml uses.
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What used to be the workflow's paths-ignore list. Anything NOT matched here is
      # code, and only then is there anything to build.
      - name: Classify changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Positive list, not negations. paths-filter ORs the patterns in a filter, so a
          # stack of '!' patterns matches whenever a file fails ANY one of them, which for
          # a docs-only change is always true. Listing what IS code keeps the OR honest.
          # PlanViewer.Ssms and PlanViewer.Ssms.Installer stay out: they are not in the
          # solution and ci.yml never built them. server/PlanShare is in: the test project
          # references it, so this job builds and tests it.
          filters: |
            code:
              - 'src/PlanViewer.App/**'
              - 'src/PlanViewer.Cli/**'
              - 'src/PlanViewer.Core/**'
              - 'src/PlanViewer.Web/**'
              - 'server/PlanShare/**'
              - 'Directory.Build.props'
              - 'src/Directory.Build.props'
              - 'Directory.Packages.props'
              - 'tests/**'
              - 'PlanViewer.sln'
              - 'global.json'
              - '.github/workflows/ci.yml'
              - '.github/scripts/run-core-tests-parallel.sh'

      - name: Setup .NET 10.0
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        if: steps.filter.outputs.code == 'true'
        run: dotnet restore PlanViewer.sln

      - name: Build solution
        if: steps.filter.outputs.code == 'true'
        run: dotnet build PlanViewer.sln -c Release --no-restore

      - name: Run tests
        if: steps.filter.outputs.code == 'true'
        run: bash .github/scripts/run-core-tests-parallel.sh
