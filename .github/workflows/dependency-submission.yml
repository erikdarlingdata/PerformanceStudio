name: Dependency submission

# Dependabot's dependency graph cannot read versions from Directory.Packages.props (central
# package management) and no project has a packages.lock.json, so the graph lists direct
# packages with no version and no transitive packages at all. That means no Dependabot
# alerts for a vulnerable transitive package (issue #650). This workflow restores the projects
# and submits what NuGet actually resolved, transitive packages included.
#
# Two jobs, so the token that can write to the repository never sits next to build-time code:
#   detect  contents: read. Restores the projects (package and MSBuild code runs here) and turns
#           the obj/project.assets.json files into a snapshot with
#           .github/scripts/New-DependencySnapshot.ps1.
#   submit  contents: write. Checks out nothing and runs no repository code. It only downloads the
#           snapshot artifact and posts it with the gh CLI that ships on the runner (issue #655).
#
# Dependabot alerts read the default branch (main), so transitive alerts start after the next
# dev-to-main release merge. Snapshots from dev feed no alerts; the dev trigger exists to
# exercise this workflow before a release merge.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

jobs:
  detect:
    # Windows, so the old-format SSMS add-in project can be restored with MSBuild too.
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # ci.yml does the same before restoring the solution (Blazor WASM project).
      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      # The snapshot script reads project.assets.json, which only exists after a restore. Every
      # restore here passes -p:NuGetAudit=false: with the audit gate on, a new high advisory fails
      # the restore, the snapshot is never submitted, and the graph goes stale exactly when an
      # alert is needed. Resolution is unchanged, and GitHub matches advisories on the submitted graph.
      - name: Restore solution
        run: dotnet restore PlanViewer.sln -p:NuGetAudit=false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Restore SSMS projects
        run: |
          dotnet restore src/PlanViewer.Ssms.Installer/PlanViewer.Ssms.Installer.csproj -p:NuGetAudit=false
          dotnet restore tests/PlanViewer.Ssms.Installer.Tests/PlanViewer.Ssms.Installer.Tests.csproj -p:NuGetAudit=false
          msbuild src/PlanViewer.Ssms/PlanViewer.Ssms.csproj -t:Restore -p:Configuration=Release -p:NuGetAudit=false

      # Fails when there is no assets file or no resolved package, so a broken restore cannot
      # replace the graph with an empty snapshot. The correlator is the one the previous action
      # used by default (the job id, "submit"), so this snapshot replaces its snapshot instead of
      # adding a second view. Values reach the script through env vars, never spliced into the script text.
      - name: Build dependency snapshot
        shell: pwsh
        env:
          SNAPSHOT_SHA: ${{ github.sha }}
          SNAPSHOT_REF: ${{ github.ref }}
          SNAPSHOT_RUN_ID: ${{ github.run_id }}
        run: ./.github/scripts/New-DependencySnapshot.ps1 -Sha $env:SNAPSHOT_SHA -Ref $env:SNAPSHOT_REF -RunId $env:SNAPSHOT_RUN_ID -Correlator 'submit' -OutputPath snapshot.json

      - name: Upload snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-snapshot
          path: snapshot.json
          if-no-files-found: error
          retention-days: 7

  submit:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-snapshot

      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/dependency-graph/snapshots" \
            --input snapshot.json > response.json
          cat response.json
          echo
          result=$(jq -r '.result' response.json)
          echo "result: $result"
          echo "message: $(jq -r '.message' response.json)"
          if [ "$result" = "INVALID" ]; then
            exit 1
          fi
