name: Nightly Build

# Builds dev and replaces the "nightly" prerelease with the result.
#
# The token that can write to the repository never sits next to build-time code (the same rule
# as dependency-submission.yml):
#   check    contents: read. Skips the build when dev has no commit from the last 24 hours.
#   build    contents: read. Restores, tests and publishes the App (package and MSBuild code runs
#            here), packages the zips and SHA256SUMS.txt, and uploads releases/ as an artifact.
#   publish  contents: write. Checks out nothing and runs no repository code. It downloads the
#            artifact and replaces the nightly release with the gh CLI that ships on the runner.

on:
  schedule:
    # 6:00 AM UTC (1:00 AM EST / 2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch: # manual trigger

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      # Build when dev's tip differs from the commit the nightly tag points at.
      # fetch-depth: 0 also fetches tags. A "commits in the last 24 hours"
      # window skipped new commits whenever GitHub started the scheduled run
      # later in the day than the run before (start times drift by hours).
      # A missing tag (deleted by a publish that failed half way) means build.
      - name: Check whether dev moved since the last nightly
        id: check
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          NIGHTLY_SHA=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          if [ "$HEAD_SHA" != "$NIGHTLY_SHA" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "dev is at $HEAD_SHA, nightly is at ${NIGHTLY_SHA:-none}: building nightly"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nightly is already built from $HEAD_SHA: skipping"
          fi

  build:
    needs: check
    if: needs.check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      sha: ${{ steps.version.outputs.SHA }}
      short_sha: ${{ steps.version.outputs.SHORT_SHA }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Runs before the restore, so nothing from the package graph has run yet
      # when these outputs are written. SHA is the dev commit this job builds;
      # the publish job tags that commit, not whatever dev points to by then.
      - name: Set nightly version
        id: version
        shell: pwsh
        run: |
          $base = ([xml](Get-Content src/Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ }
          $date = Get-Date -Format "yyyyMMdd"
          $nightly = "$base-nightly.$date"
          echo "VERSION=$nightly" >> $env:GITHUB_OUTPUT
          echo "Nightly version: $nightly"
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $short = git rev-parse --short HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "SHA=$sha" >> $env:GITHUB_OUTPUT
          echo "SHORT_SHA=$short" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: |
          dotnet restore src/PlanViewer.Core/PlanViewer.Core.csproj
          dotnet restore src/PlanViewer.App/PlanViewer.App.csproj
          dotnet restore src/PlanViewer.Cli/PlanViewer.Cli.csproj
          dotnet restore tests/PlanViewer.Core.Tests/PlanViewer.Core.Tests.csproj

      - name: Run tests
        run: dotnet test tests/PlanViewer.Core.Tests/PlanViewer.Core.Tests.csproj -c Release --verbosity normal -- --hangdump --hangdump-timeout 5m --hangdump-type none

      - name: Publish App (all platforms)
        run: |
          dotnet publish src/PlanViewer.App/PlanViewer.App.csproj -c Release -r win-x64 --self-contained -o publish/win-x64
          dotnet publish src/PlanViewer.App/PlanViewer.App.csproj -c Release -r linux-x64 --self-contained -o publish/linux-x64
          dotnet publish src/PlanViewer.App/PlanViewer.App.csproj -c Release -r osx-x64 --self-contained -o publish/osx-x64
          dotnet publish src/PlanViewer.App/PlanViewer.App.csproj -c Release -r osx-arm64 --self-contained -o publish/osx-arm64

      - name: Package artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          New-Item -ItemType Directory -Force -Path releases

          # Windows: flat zip via Compress-Archive (no Unix execute bit needed).
          if (Test-Path 'README.md') { Copy-Item 'README.md' 'publish/win-x64/' }
          if (Test-Path 'LICENSE') { Copy-Item 'LICENSE' 'publish/win-x64/' }
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath "releases/PerformanceStudio-win-x64-$env:VERSION.zip" -Force

          # Linux: flat zip via zip_with_exec.py so the apphost keeps its execute
          # bit. Compress-Archive stamps the archive host byte as Windows, so the
          # Unix mode is dropped and the binary extracts non-executable.
          if (Test-Path 'README.md') { Copy-Item 'README.md' 'publish/linux-x64/' }
          if (Test-Path 'LICENSE') { Copy-Item 'LICENSE' 'publish/linux-x64/' }
          python .github/scripts/zip_with_exec.py publish/linux-x64 "releases/PerformanceStudio-linux-x64-$env:VERSION.zip" --exec PlanViewer.App --exec-optional createdump
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Package macOS as proper .app bundles
          foreach ($rid in @('osx-x64', 'osx-arm64')) {
            $appName = "PerformanceStudio.app"
            $bundleDir = "publish/$rid-bundle/$appName"

            New-Item -ItemType Directory -Force -Path "$bundleDir/Contents/MacOS"
            New-Item -ItemType Directory -Force -Path "$bundleDir/Contents/Resources"

            Copy-Item -Path "publish/$rid/*" -Destination "$bundleDir/Contents/MacOS/" -Recurse

            if (Test-Path "$bundleDir/Contents/MacOS/Info.plist") {
              Move-Item -Path "$bundleDir/Contents/MacOS/Info.plist" -Destination "$bundleDir/Contents/Info.plist" -Force
            }

            $plist = Get-Content "$bundleDir/Contents/Info.plist" -Raw
            $plist = $plist -replace '(<key>CFBundleVersion</key>\s*<string>)[^<]*(</string>)', "`${1}$env:VERSION`${2}"
            $plist = $plist -replace '(<key>CFBundleShortVersionString</key>\s*<string>)[^<]*(</string>)', "`${1}$env:VERSION`${2}"
            Set-Content -Path "$bundleDir/Contents/Info.plist" -Value $plist -NoNewline

            if (Test-Path "$bundleDir/Contents/MacOS/EDD.icns") {
              Move-Item -Path "$bundleDir/Contents/MacOS/EDD.icns" -Destination "$bundleDir/Contents/Resources/EDD.icns" -Force
            }

            $wrapperDir = "publish/$rid-bundle"
            if (Test-Path 'README.md') { Copy-Item 'README.md' "$wrapperDir/" }
            if (Test-Path 'LICENSE') { Copy-Item 'LICENSE' "$wrapperDir/" }

            # Zip the bundle with zip_with_exec.py so the apphost inside the .app
            # keeps its execute bit (Compress-Archive would strip it).
            python .github/scripts/zip_with_exec.py "$wrapperDir" "releases/PerformanceStudio-$rid-$env:VERSION.zip" --exec "PerformanceStudio.app/Contents/MacOS/PlanViewer.App" --exec-optional "PerformanceStudio.app/Contents/MacOS/createdump"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $checksums = Get-ChildItem releases/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # LF line endings and no BOM. Out-File writes CRLF on Windows, and then
          # `sha256sum -c` and `shasum -c` on Linux and macOS read the \r as part
          # of each file name and report every file as missing. release.yml
          # writes its SHA256SUMS.txt the same way; keep the two in step.
          [IO.File]::WriteAllText("$PWD/releases/SHA256SUMS.txt", (($checksums -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
          Write-Host "Checksums:"
          $checksums | ForEach-Object { Write-Host $_ }

      - name: Upload the nightly files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-release
          path: releases/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download the nightly files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-release
          path: releases

      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes --cleanup-tag --repo "$env:GITHUB_REPOSITORY" 2>$null; exit 0
        shell: pwsh

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        shell: pwsh
        run: |
          $version = $env:VERSION
          $sha = $env:SHORT_SHA
          $body = @"
          Automated nightly build from ``dev`` branch.

          **Version:** ``$version``
          **Commit:** ``$sha``
          **Built:** $(Get-Date -Format "yyyy-MM-dd HH:mm UTC")

          > These builds include the latest changes and may be unstable.
          > For production use, download the [latest stable release](https://github.com/erikdarlingdata/PerformanceStudio/releases/latest).
          "@

          gh release create nightly `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SHA `
            --title "Nightly Build ($version)" `
            --notes $body `
            --prerelease `
            releases/*.zip releases/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
