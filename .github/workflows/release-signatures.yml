name: Release signatures

# Every executable `vpk pack` GENERATES (Setup.exe, and the launcher and Update.exe in
# Portable.zip) shipped unsigned on every release through v1.28.0, while the app payload was
# signed. release.yml now signs them after packing. The post-pack signing lives in
# .github/scripts/postpack_signing.py and the reader that checks the result lives in
# .github/scripts/verify_release_signatures.py. Both come from PerformanceMonitor (its #3288).
# This workflow exists so neither can rot unnoticed, and so a published release can be audited
# on demand without a local checkout.
#
# Neither self-test needs SignPath, a release, or a Windows runner. That matters because the
# release path itself runs only when dev is merged into main, and it blocks on manual approvals,
# so these self-tests are the only part of it that a pull request can exercise.
#
# The release-time guard is not here. It is the "Assert every Velopack executable is signed"
# step in release.yml, which checks the files on disk before anything is published. This one
# answers "what did we actually publish", which needs the release to exist first.
on:
  pull_request:
    paths:
      - '.github/scripts/verify_release_signatures.py'
      - '.github/scripts/postpack_signing.py'
      - '.github/workflows/release-signatures.yml'
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to audit (e.g. v1.29.0). Leave blank to self-test only.'
        required: false
        type: string

concurrency:
  group: release-signatures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Covers the PE parse and the release guard's allowlist. The allowlist cases are the ones
      # worth naming: the two allowed names also appear as the portable zip's root launcher and
      # as Update.exe, so a skip written by filename alone would let an unsigned Setup.exe and an
      # unsigned launcher through, which is the defect. Each case pairs a member path with a
      # container, and a mutation broadening the match to the basename turns this step red.
      - name: Self-test the signature reader
        run: python3 .github/scripts/verify_release_signatures.py --self-test

      # Covers the staging rules and the portable-zip rebuild. The rebuild matters because the
      # zip is a shipped artifact: the self-test asserts that a re-created archive, which loses
      # entry order and the stored `.portable` marker, is refused.
      - name: Self-test the post-pack signing script
        run: python3 .github/scripts/postpack_signing.py --self-test

      # Manual only, because it requires a published release. It exits 1 for v1.28.0 and every
      # earlier release, which shipped Setup.exe and the portable launcher unsigned.
      - name: Audit a published release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/verify_release_signatures.py "$TAG"
